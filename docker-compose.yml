version: "3.8"

services:
  db2:
    build: .
    container_name: db2-gtky
    privileged: true
    shm_size: '1gb'  # 增加到 1GB 確保記憶體充足
    ports:
      - "50000:50000"
    environment:
      - DB2INST1_PASSWORD=${DB2_PASSWORD}
      - DBNAME=${DBNAME}
      - APP_USER=${APP_USER}
      - APP_PASSWORD=${APP_PASSWORD}
      # 指定只還原某個資料庫；留空則掃描 backups/ 下全部
      - RESTORE_DB=${RESTORE_DB:-}
      - LICENSE=accept
      - PERSIST_CONFIG=false  # 嘗試關閉持久化設定以避開 mount 權限問題
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 65536
        hard: 65536
    sysctls:
      - kernel.msgmni=1024
      - kernel.msgmax=65536
      - kernel.msgmnb=65536
      - kernel.shmmax=68719476736
      - kernel.shmall=4294967296
    volumes:
      # 改用單一目錄掛載，有助於減少權限問題
      - ./db2_storage:/database
      # 備份檔獨立掛載，才不會混在 DB2 產生的 db2_storage 裡
      # 結構為 backups/{database}/，還原時由 restore-databases.sh 掃描
      - ./backups:/database/backups

# 移除原本的 volume 定義，改用本地目錄
